name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Verification
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build & Export Static Site
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Ensure .nojekyll Exists in Export Output
        run: touch ./out/.nojekyll

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
